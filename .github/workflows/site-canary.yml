name: Site canary

# Opens the live site in a real browser every six hours and after every push
# to main: sign in, see the console report itself operational, open a stored
# case. Demo health checks the traces through the API; this checks what a
# judge actually sees. Read-only -- it never starts a trace.
on:
  schedule:
    - cron: "15 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

# The jobs only read the repository; the token gets nothing more.
permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # After a push, wait out a redeploy (automatic or `railway up`) so the
      # check is more likely to see the new build than the old one.
      - if: github.event_name == 'push'
        run: sleep 240
      - run: npm run canary
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: canary-failure
          path: frontend/test-results/
          retention-days: 7

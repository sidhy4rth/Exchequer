name: Refresh lists

# Re-reads the sanctions and freeze lists a trace is screened against, once a
# night, and opens one pull request when a list changes or its date is getting
# old. A person merges it: a list that decides who gets called sanctioned never
# reaches main unread. backend/scripts/import_all_lists.py explains what counts
# as a change and what is refused.
#
# Two jobs. `refresh` downloads and parses other people's files (OFAC, UK, EU,
# OpenSanctions, TronGrid), so it holds no write token and restores no cache;
# it hands the refreshed lists to `publish` as an artifact. `publish` takes
# only files that read as lists (.github/scripts/accept_lists.py), installs
# nothing, and opens the pull request.
#
# It needs, set by the repository's owner:
#   - environment `lists` (deployment branches: main only): a CI-only
#     ETHERSCAN_API_KEY secret (never Render's), and NODEREAL_API_KEY /
#     TRONGRID_API_KEY if wanted. A list whose key is missing is skipped,
#     and the run is red until it is set.
#   - environment `list-publish` (main only): the list bot, a GitHub App
#     with Contents and Pull requests read/write on this repository, as the
#     variable LIST_BOT_APP_ID (its client ID) and the secret LIST_BOT_KEY (a
#     private key). Its pull requests run the tests. Without it the job uses
#     this workflow's own token, which needs Settings > Actions > General >
#     "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "0 20 * * *" # 01:30 IST
  workflow_dispatch:

# Nothing by default; each job asks for what it uses.
permissions: {}

# A run started by hand while the nightly one is going would race it to the
# same bot branch; the second waits instead.
concurrency:
  group: refresh-lists
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # The provider keys live in this environment, which deploys from main only.
    environment: lists
    permissions:
      contents: read
    outputs:
      title: ${{ steps.lists.outputs.title }}
      tested: ${{ steps.tests.outputs.tested }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No token was left on disk
        run: test -z "$(git config --get-regexp '^http\..*\.extraheader$' || true)"
      # No `cache:`: a cache another workflow wrote is never restored here.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Run the importers
        id: lists
        # A list that failed still lets the others through; the last step turns the run red.
        continue-on-error: true
        # The keys reach this step only: the test suite runs with none, as in CI.
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          NODEREAL_API_KEY: ${{ secrets.NODEREAL_API_KEY }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
        run: python -m scripts.import_all_lists --strict --summary "$RUNNER_TEMP/lists.md"
      - name: The refreshed lists pass the test suite
        id: tests
        if: steps.lists.outputs.open_pr == 'true'
        run: |
          python -m pytest -q -p no:warnings
          echo "tested=true" >> "$GITHUB_OUTPUT"
      - name: Gather the lists for the publish job
        if: steps.tests.outputs.tested == 'true'
        run: |
          mkdir "$RUNNER_TEMP/lists"
          cp data/risk_labels*.json data/intl_sanctions*.json data/frozen_labels*.json "$RUNNER_TEMP/lists/"
          cp "$RUNNER_TEMP/lists.md" "$RUNNER_TEMP/lists/lists.md"
      - if: steps.tests.outputs.tested == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refreshed-lists
          path: ${{ runner.temp }}/lists/
          retention-days: 3
          if-no-files-found: error
      - name: Say so if a list could not be refreshed
        if: steps.lists.outcome == 'failure'
        run: |
          echo "::error::A list could not be refreshed, or was skipped for want of its key. The list already held was kept; see the run's summary."
          exit 1

  publish:
    needs: refresh
    # Tested lists go out even when another list failed (that job is red).
    if: ${{ !cancelled() && needs.refresh.outputs.tested == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The list bot's key lives in this environment, which deploys from main only.
    environment: list-publish
    # For the fallback without the list bot; the bot's own token does the writing when it is set up.
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refreshed-lists
          path: ${{ runner.temp }}/downloaded
      - name: Take only files that read as lists
        run: python3 ../.github/scripts/accept_lists.py "$RUNNER_TEMP/downloaded" data "$RUNNER_TEMP/lists.md"
      - name: The list bot's token
        id: bot
        if: vars.LIST_BOT_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.LIST_BOT_APP_ID }}
          private-key: ${{ secrets.LIST_BOT_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          BOT: ${{ steps.bot.outputs.token != '' }}
          TITLE: ${{ needs.refresh.outputs.title }}
          BRANCH: b/r11-refresh-lists-bot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          # Named files only: nothing else a run leaves behind belongs in this pull request.
          git add -- data/risk_labels*.json data/intl_sanctions*.json data/frozen_labels*.json
          git commit -m "$TITLE"
          # The checkout kept no token; git borrows this step's for the push only.
          gh auth setup-git
          # This job's own branch, rebuilt from main each night, so there is one open PR.
          git push --force origin "$BRANCH"
          if [ "$BOT" != "true" ]; then
            {
              echo
              echo "The backend tests passed in the job that opened this. Tests do not start on their own"
              echo "for a pull request this workflow's token opens: close and reopen it to run them here."
            } >> "$RUNNER_TEMP/lists.md"
          fi
          state=$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || echo NONE)
          if [ "$state" = "OPEN" ]; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/lists.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/lists.md"
          fi

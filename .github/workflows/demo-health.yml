name: Demo health

# Re-runs every DEMO.md trace against the live site once a day and fails if an
# attribution or score moved, so a drift is found here and not by a judge.
# The live site does the tracing (with save: false), so this job needs no keys
# and installs nothing.
on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST
  workflow_dispatch:

# The jobs only read the repository; the token gets nothing more.
permissions:
  contents: read

jobs:
  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXCHEQUER_URL: ${{ vars.SITE_URL || 'https://exchequer-6gnl.onrender.com' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Yesterday's misses: a demo built to move fails only if it reaches no
      # exchange two runs in a row (see check_demos.py --state).
      - uses: actions/cache/restore@v6
        with:
          path: demo_state.json
          key: demo-health-state-${{ github.run_id }}
          restore-keys: demo-health-state-
      # The free Render instance sleeps after 15 idle minutes and takes up to
      # a minute or two to wake; knock first so the checks time the app, not
      # the boot.
      - name: Wake the site
        run: |
          for i in $(seq 1 24); do
            curl -fsS -m 20 "$EXCHEQUER_URL/health" >/dev/null && exit 0
            sleep 10
          done
          echo "site did not answer /health within 4 minutes"; exit 1
      - name: Re-run the DEMO.md traces on the live site
        run: python backend/scripts/check_demos.py --state demo_state.json --base "$EXCHEQUER_URL"
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: demo_state.json
          key: demo-health-state-${{ github.run_id }}

name: FIU-IND sources due

# Every FIU-IND note prints the day Exchequer last checked its sources
# (backend/data/fiu_ind_status.json, _meta.checked_on), and they are re-checked
# at least every 180 days (docs/flag-rollout.md). The test suite checks that
# against a fixed day, so this runs the check against the real date once a
# week, with no commit needed. It only warns (an annotation on the run) and
# never fails: an old date must not block anything. The backend tests run the
# same script on every pull request (test.yml).
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 08:30 IST
  workflow_dispatch:

# The job only reads the repository; the token gets nothing more. No secrets.
permissions:
  contents: read

jobs:
  staleness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --require-hashes -r requirements.txt
      - name: Warn if the FIU-IND sources are more than 180 days old
        run: python scripts/check_fiu_staleness.py

name: Store backup

# Dumps the case store (Neon Postgres, DATABASE_URL on Render) once a night
# and keeps the dump here, encrypted, so losing the Neon project does not lose
# the cases, freeze requests and watches. The dump is encrypted with age to a
# public key before it is stored; only the holder of the matching private key
# can open it, and the plain dump never leaves the runner. See
# docs/operations.md, "Backups".
#
# Set up in the `backup` environment (Settings -> Environments; deployment
# branches: main only): the secret NEON_BACKUP_URL (a read-only Neon role's
# connection string) and the variable BACKUP_AGE_RECIPIENT (the age public
# key, the same as .github/backup-recipient.txt). Until both exist the job
# fails, so a backup that copies nothing never shows green.
on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    environment: backup
    timeout-minutes: 20
    env:
      NEON_BACKUP_URL: ${{ secrets.NEON_BACKUP_URL }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      # pg_dump must be at least the server's major version (Neon's console shows it).
      PG_IMAGE: postgres:${{ vars.BACKUP_PG_MAJOR || '17' }}-bookworm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the job is set up
        run: |
          if [ -z "${NEON_BACKUP_URL:-}" ] || [ -z "${BACKUP_AGE_RECIPIENT:-}" ]; then
            echo "::error::Backups are not set up: the 'backup' environment needs the NEON_BACKUP_URL secret and the BACKUP_AGE_RECIPIENT variable (docs/operations.md, Backups)."
            exit 1
          fi
          # The recipient comes from the protected environment, not from the
          # checked-out commit: a changed file cannot re-target the backups.
          if [ "$(tr -d '[:space:]' < .github/backup-recipient.txt)" != "$(printf '%s' "$BACKUP_AGE_RECIPIENT" | tr -d '[:space:]')" ]; then
            echo "::error::.github/backup-recipient.txt differs from the BACKUP_AGE_RECIPIENT variable; refusing to encrypt to either."
            exit 1
          fi
      - name: Dump, check and encrypt the store
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq age > /dev/null
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          docker run --rm -e NEON_BACKUP_URL "$PG_IMAGE" \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges --dbname="$NEON_BACKUP_URL"' > store.pgdump
          # A readable archive that holds the cases table's rows; prints nothing.
          # (grep reads it all: -q would close the pipe early under pipefail.)
          docker run --rm -i "$PG_IMAGE" pg_restore --list < store.pgdump | grep 'TABLE DATA public cases ' > /dev/null
          age -r "$BACKUP_AGE_RECIPIENT" -o "exchequer-$stamp.pgdump.age" store.pgdump
          rm -f store.pgdump
          echo "FILE=exchequer-$stamp.pgdump.age" >> "$GITHUB_ENV"
      - name: Keep the encrypted dump
        uses: actions/upload-artifact@v7
        with:
          name: store-${{ github.run_id }}
          path: ${{ env.FILE }}
          retention-days: 14
          if-no-files-found: error

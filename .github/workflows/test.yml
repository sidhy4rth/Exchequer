# Runs on every pull request and every push to main: the backend test suite
# on a machine with no .env and no API key -- the suite never touches the
# network -- and the frontend's component tests plus a production build (the
# citizen site's too). Matches what the Dockerfile builds, so a green run here
# means the image will build too.
#
# A pull request that changes only documentation (files under docs/, or a
# Markdown file at the repository root) skips the jobs that cannot see it:
# frontend, accessibility, image, migrations and the citizen site's npm steps.
# Those jobs still start and report success, because they are required checks
# on main and a check that never reports leaves the pull request waiting
# forever (a workflow-level paths-ignore would do exactly that). Backend
# tests, the citizen API tests and commit e-mails always run: tests read
# docs/operations.md, docs/citizen-deploy.md, DEMO.md and SECURITY.md, and
# scan every tracked file for keys. Pushes to main always run everything, and
# so does any pull request the `changes` job is unsure of (docs/operations.md,
# "CI on pull requests").
name: tests

# A push to a branch with a pull request used to run everything twice (once
# for the push, once for the pull request). The pull request run is the one
# main's required checks read, so pushes run only on main, where they check
# each merge. Open a draft pull request to get a branch tested.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its older, now pointless run. Main is
# never cancelled or queued behind another merge: each of its runs gets a group
# of its own (the commit), so every merge is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The jobs only read the repository; the token gets nothing more.
permissions:
  contents: read

jobs:
  # The repository is public and commit metadata cannot be taken back: every
  # new commit must carry a GitHub noreply address (r1-secrets-history-4).
  # Old history is left as it is (the addresses are already public and cached).
  emails:
    name: commit e-mails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: New commits use a GitHub noreply address
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/check_commit_emails.sh "$BASE" "$HEAD_SHA"
      # No AI assistant as author, committer or co-author (ADR-0010).
      - name: New commits credit no AI assistant
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/check_no_ai_attribution.sh "$BASE" "$HEAD_SHA"

  # Whether this pull request changes only documentation. It diffs the merge
  # commit the other jobs test against its first parent (main as it is now),
  # so the answer is about exactly the tree under test, not the branch's
  # history. Trees only: no file contents are downloaded. On a push, or if
  # anything here goes wrong, docs_only is false or empty and every job runs
  # in full; the gated jobs also run when this job fails (`!cancelled()`).
  changes:
    name: what the pull request changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github/scripts
      - name: Only docs/ or root Markdown files changed?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          docs_only=false
          # HEAD^2 exists only on the merge commit a pull request run tests.
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify 'HEAD^2' >/dev/null \
             && files=$(git diff --no-renames --name-only 'HEAD^1' HEAD); then
            printf '%s\n' "$files"
            docs_only=$(printf '%s\n' "$files" | bash .github/scripts/docs_only.sh) || docs_only=false
          fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # The suite runs in three shards at once, each on its own runner, so no two
  # shards share a temporary file or a port. tests/conftest.py splits the
  # files the full collection finds into EXCHEQUER_TEST_SHARD's part: every
  # file lands in exactly one shard, so the three together run every test.
  # Lint and the FIU-IND note run once, in the first shard. Never gated.
  backend:
    name: backend shard ${{ matrix.shard }} of 3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # The dev lock: the image's packages plus pytest, ruff and PyYAML, all hashed.
      - run: pip install --require-hashes -r requirements-dev.txt
      - if: matrix.shard == 1
        run: ruff check app scripts tests migrations
      - run: python -m pytest -p no:warnings
        env:
          EXCHEQUER_TEST_SHARD: ${{ matrix.shard }}/3
      # Warns (never fails) once the FIU-IND sources are more than 180 days
      # old by the real date; fiu-staleness.yml runs it weekly too.
      - if: matrix.shard == 1
        run: python scripts/check_fiu_staleness.py

  # The required check: passes only when every backend shard passed. A
  # failed, cancelled or skipped shard fails it.
  backend_all:
    name: backend tests
    needs: backend
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every backend shard passed
        env:
          RESULT: ${{ needs.backend.result }}
        run: test "$RESULT" = success

  # The suite migrates SQLite; the deployment may run on Postgres
  # (DATABASE_URL), so the same migrations run here against a real one.
  migrations:
    name: migrations on Postgres
    needs: changes
    # Runs even if `changes` failed: an empty answer means test everything.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    services:
      postgres:
        # The same pinned image as backup.yml's pg_dump for Postgres 17.
        image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: exchequer
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/exchequer
    defaults:
      run:
        working-directory: backend
    steps:
      - if: needs.changes.outputs.docs_only == 'true'
        working-directory: ${{ github.workspace }}
        run: echo "Only documentation changed, so this job skips its checks (pushes to main run them)."
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - if: needs.changes.outputs.docs_only != 'true'
        run: pip install --require-hashes -r requirements.txt
      - if: needs.changes.outputs.docs_only != 'true'
        name: Exactly one migration head (two means two branches each added one; rebase and renumber)
        run: test "$(alembic heads | wc -l)" -eq 1
      - if: needs.changes.outputs.docs_only != 'true'
        name: An empty database reaches head, and a second run changes nothing
        run: alembic upgrade head && alembic upgrade head && alembic current | grep -q "(head)"
      - if: needs.changes.outputs.docs_only != 'true'
        name: The schema matches app/models.py
        run: alembic check
      # A booting instance and the CLI (or a script) can migrate at the same
      # moment; the advisory lock (models.guard_migrations) makes the second
      # wait for the first instead of failing on "relation already exists".
      - if: needs.changes.outputs.docs_only != 'true'
        name: Two migrators at once on an empty database both succeed
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from app import models
          with models.engine().begin() as conn:
              conn.execute(text("DROP SCHEMA public CASCADE"))
              conn.execute(text("CREATE SCHEMA public"))
          PY
          alembic upgrade head & first=$!
          alembic upgrade head & second=$!
          wait "$first"
          wait "$second"
          alembic current | grep -q "(head)"
          alembic check
      # The baseline's schema with no version table is what create_all() made
      # before migrations (today's models are ahead of it).
      - if: needs.changes.outputs.docs_only != 'true'
        name: A store made before migrations is adopted with its cases
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from app import models
          with models.engine().begin() as conn:
              conn.execute(text("DROP SCHEMA public CASCADE"))
              conn.execute(text("CREATE SCHEMA public"))
          PY
          alembic upgrade 0001
          python - <<'PY'
          from sqlalchemy import text
          from app import models
          with models.engine().begin() as conn:
              conn.execute(text("DROP TABLE alembic_version"))
              conn.execute(text("INSERT INTO cases (id, address, created_at, result_json) "
                                "VALUES ('kept', :a, '2026-11-01T00:00:00+00:00', '{}')"), {"a": "0x" + "1" * 40})
          PY
          alembic upgrade head
          alembic check
          python -c "from app import models; assert models.get_case('kept') is not None"
      # The citizen site's own role (citizen/api/citizen_role.sql): the
      # citizen functions work as it, and it can reach nothing else.
      - if: needs.changes.outputs.docs_only != 'true'
        name: The citizen role can use the citizen tables and nothing else
        run: alembic upgrade head && python scripts/check_citizen_role.py

  frontend:
    name: frontend tests + build
    needs: changes
    # Runs even if `changes` failed: an empty answer means test everything.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - if: needs.changes.outputs.docs_only == 'true'
        working-directory: ${{ github.workspace }}
        run: echo "Only documentation changed, so this job skips its checks (pushes to main run them)."
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --ignore-scripts
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm test
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run build
        env:
          VITE_API_BASE: ""

  # WCAG 2.2 AA, checked by axe in a real browser on every page in both
  # themes, at a desktop and a phone size (frontend/e2e/a11y.spec.js). The
  # backend serves the fresh build on this runner with no provider key: the
  # pages and a recorded demo need none, and nothing here starts a trace.
  # Playwright splits the tests into four shards, each on its own runner
  # with its own build and backend; together they run every test.
  a11y:
    name: accessibility shard ${{ matrix.shard }} of 4
    needs: changes
    # Runs even if `changes` failed: an empty answer means test everything.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      EXCHEQUER_URL: http://127.0.0.1:8000
    steps:
      - if: needs.changes.outputs.docs_only == 'true'
        working-directory: ${{ github.workspace }}
        run: echo "Only documentation changed, so this job skips its checks (pushes to main run them)."
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: needs.changes.outputs.docs_only != 'true'
        run: pip install --require-hashes -r requirements.txt
        working-directory: backend
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --ignore-scripts
        working-directory: frontend
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE: ""
      - if: needs.changes.outputs.docs_only != 'true'
        name: Serve the build from the backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --ws none > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS "$EXCHEQUER_URL/health" >/dev/null && exit 0; sleep 2; done
          echo "the backend did not answer /health within a minute"; exit 1
      - if: needs.changes.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run a11y -- --shard="$SHARD"
        working-directory: frontend
        env:
          SHARD: ${{ matrix.shard }}/4
      - if: failure()
        run: cat "$RUNNER_TEMP/uvicorn.log"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-failure-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7

  # The required check: passes only when every accessibility shard passed
  # (on a docs-only pull request each shard reports success with its steps
  # skipped, as before).
  a11y_all:
    name: accessibility (WCAG 2.2 AA)
    needs: a11y
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every accessibility shard passed
        env:
          RESULT: ${{ needs.a11y.result }}
        run: test "$RESULT" = success

  # The citizen site (its own Vercel project): its functions' tests (on
  # SQLite, migrated by the backend's migrations; no network), page tests,
  # then the build.
  citizen:
    name: citizen site tests + build
    needs: changes
    # Runs even if `changes` failed: an empty answer means test everything.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: citizen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
        working-directory: backend
      - run: ruff check --config ../backend/ruff.toml api
      - run: python -m pytest -p no:warnings api/tests
      - if: needs.changes.outputs.docs_only == 'true'
        working-directory: ${{ github.workspace }}
        run: echo "Only documentation changed, so the API tests ran and the page tests and build are skipped (pushes to main run them)."
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: citizen/package-lock.json
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --ignore-scripts
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm test
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run build

  image:
    name: docker image builds and runs as non-root
    needs: changes
    # Runs even if `changes` failed: an empty answer means test everything.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.docs_only == 'true'
        working-directory: ${{ github.workspace }}
        run: echo "Only documentation changed, so this job skips its checks (pushes to main run them)."
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build secret here, so the label store is not required (the image's
      # default fails a build without it).
      - if: needs.changes.outputs.docs_only != 'true'
        run: docker build --build-arg LABEL_STORE_REQUIRED=0 -t exchequer:ci .
      # Start it the way Railway does -- as root, with a root-owned volume at
      # /data -- and check the entrypoint handed the volume to the app user.
      - if: needs.changes.outputs.docs_only != 'true'
        name: Start the image with a volume
        run: |
          docker volume create data
          docker run -d --name app -p 8000:8000 -v data:/data -e PORT=8000 -e EXCHEQUER_WARM_CACHE=0 exchequer:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health >/dev/null && break; sleep 2; done
          curl -fsS localhost:8000/health
      - if: needs.changes.outputs.docs_only != 'true'
        name: The app runs as uid 10001 and owns its files on the volume
        run: |
          # The entrypoint execs all the way down, so PID 1 is uvicorn itself.
          docker exec app cat /proc/1/cmdline | tr '\0' ' ' | grep uvicorn
          uid=$(docker exec app awk '/^Uid:/{print $2}' /proc/1/status)
          echo "uvicorn uid: $uid"
          test "$uid" = "10001"
          # HOME is the volume, not root's home: libpq reads ~/.postgresql
          # there and must never meet a directory it may not open.
          # Read as uid 10001: Docker drops CAP_SYS_PTRACE, so root may not read
          # another user's /proc/<pid>/environ, but a process's own user may.
          docker exec -u 10001 app sh -c 'tr "\0" "\n" < /proc/1/environ' | grep -x 'HOME=/data'
          curl -fsS localhost:8000/signing-key >/dev/null
          docker exec app stat -c '%u %n' /data/exchequer.db /data/report_signing_key.pem
          test "$(docker exec app stat -c '%u' /data/report_signing_key.pem)" = "10001"
      - if: needs.changes.outputs.docs_only != 'true'
        name: Security headers are sent and API docs are off
        run: |
          # Asked as a browser asks: anything else gets a JSON 404 for a path
          # the API does not have (main.py), and -f would fail on it.
          curl -fsS -H 'Sec-Fetch-Mode: navigate' -D - -o /dev/null localhost:8000/ | grep -i '^content-security-policy:'
          # With docs off, /docs is not an API path: a browser gets the app's
          # page and curl a 404. Look for Swagger UI and the schema either way.
          if curl -s localhost:8000/docs | grep -qi swagger; then echo "docs exposed"; exit 1; fi
          if curl -s localhost:8000/openapi.json | grep -q '"openapi"'; then echo "schema exposed"; exit 1; fi
      - if: failure()
        run: docker logs app

  # The nightly list refresh (refresh-lists.yml) rebuilds one branch and stages
  # only the OFAC, intl and Tether list files. Its pull request is read as list
  # data, so a change to anything else on that branch is refused here. Skipped,
  # which counts as passing, on every other pull request. It reads the pull
  # request's file list through the API, so it checks out nothing.
  bot-scope:
    name: bot branch touches only list files
    if: github.event_name == 'pull_request' && github.head_ref == 'b/r11-refresh-lists-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Every file the pull request changes is a refreshed list
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # A renamed file counts under its old name too.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          test -n "$files"
          outside=$(printf '%s\n' "$files" | grep -Ev '^backend/data/(risk_labels|intl_sanctions|frozen_labels)[a-z_]*\.json$' || true)
          if [ -n "$outside" ]; then
            echo "::error::The list-refresh pull request changes files that are not lists:"
            printf '%s\n' "$outside"
            exit 1
          fi

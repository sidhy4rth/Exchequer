# Render Blueprint: the same Docker image as before, on Render's free plan.
#
# New > Blueprint in the Render dashboard, pick this repository, and Render
# asks once for every `sync: false` value below. The free plan has no disk:
# the container's /data is wiped on each restart and after 15 idle minutes,
# so the case store lives in Postgres (DATABASE_URL) instead. Leave it blank
# and the site still runs, with a store that forgets.
services:
  - type: web
    name: exchequer
    runtime: docker
    plan: free
    # Closest Render region to India; it cannot be changed after creation.
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Provider keys (backend/.env.example says where each comes from).
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: NODEREAL_API_KEY
        sync: false
      - key: TRONGRID_API_KEY
        sync: false
      - key: TRONSCAN_API_KEY
        sync: false
      # postgres://… from a free Neon project (neon.tech); see models.py.
      - key: DATABASE_URL
        sync: false
      # Render's 256-bit base64 value is exactly an Ed25519 seed, so reports
      # signed today still verify after a restart (signing.py).
      - key: EXCHEQUER_SIGNING_KEY
        generateValue: true
      # Bearer token for /health/detail, the operator's view (coverage.py);
      # read it in the dashboard. Public /health says only up or down.
      - key: EXCHEQUER_HEALTH_TOKEN
        generateValue: true
      # The demo code (access.py): set, the public site shows recorded demos
      # and live tracing needs the code; blank, everything stays open. Keep
      # the repository secret DEMO_CODE equal to it for the Demo health job.
      - key: EXCHEQUER_DEMO_CODE
        sync: false
      # Render puts the client's address first in X-Forwarded-For.
      - key: EXCHEQUER_TRUST_PROXY
        value: render
      # Each wake from sleep starts with an empty provider cache; re-tracing
      # every demo then would spend the free quota and slow the first visitor
      # on a tenth of a CPU. The recorded demos open instantly instead.
      - key: EXCHEQUER_WARM_CACHE
        value: "0"
      # The free plan sleeps after 15 idle minutes and the watcher sleeps with
      # it, so a watch set at noon would go unchecked all night while the panel
      # promised every ten minutes. Off: watches are checked when someone
      # presses Check now, and the panel says so (watchlist.watcher_status).
      # Turn it on with a host that stays awake.
      - key: EXCHEQUER_WATCHER
        value: "0"
      # The daily snapshot copies a SQLite file on the volume; there is none.
      - key: EXCHEQUER_BACKUPS
        value: "0"

# Schema migrations for the case store (CLAUDE.md rule 4: every schema change
# is a migration here, and exactly one head may exist). The database is the
# app's own -- DATABASE_URL, else EXCHEQUER_DB_PATH -- see migrations/env.py.
#
# From backend/:
#   alembic upgrade head                  bring the store to the current schema
#   alembic heads                         must print exactly one revision
#   alembic check                         fails if models.py and the migrations disagree
#   alembic revision --rev-id 0002 -m "add x to y"    start the next migration
#
# The app runs `upgrade head` itself at startup (models.init_db), so a deploy
# needs no extra step.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
